<!doctype html>
<!--
  Demo GIF animation. Every frame is a pure function of time: open
  demo.html?t=2.5 to see the frame at 2.5 s, or call window.render(t).
  No timers, no wall clock, so render.ts can screenshot frames exactly.

  Data comes from capture.js, which render.ts writes from capture.json
  (real tool output recorded by capture.ts).

  Regenerate: bun run scripts/demo/capture.ts && bun run scripts/demo/render.ts
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>cosmos-mcp demo</title>
<style>
  :root {
    --bg: #f3f2ee;
    --panel: #ffffff;
    --line: #e2e0d9;
    --ink: #1c1c1a;
    --muted: #7a7871;
    --accent: #2c6e68;
    --ok: #3d7a3a;
    --mono: "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink); position: relative; -webkit-font-smoothing: antialiased; }

  #chat {
    position: absolute; left: 20px; top: 20px; width: 316px; height: 434px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 16px; overflow: hidden;
  }
  .label { font: 600 10px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  #prompt { font: 500 15px/1.4 var(--sans); min-height: 42px; }
  .cursor { display: inline-block; width: 2px; height: 17px; background: var(--ink); vertical-align: -3px; margin-left: 1px; }
  #calls { margin-top: 18px; }
  .call { margin-bottom: 14px; font: 12px/1.5 var(--mono); }
  .call .name { color: var(--accent); font-weight: 600; }
  .call .name::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; }
  .call .args { color: var(--muted); padding-left: 14px; }
  .call .res { padding-left: 14px; color: var(--ok); }
  .spin { color: var(--muted); }
  #done { font: 13px/1.45 var(--sans); color: var(--ink); }

  #board {
    position: absolute; left: 348px; top: 20px; width: 432px; height: 434px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  #board .empty { position: absolute; inset: 0; display: grid; place-items: center; font: 12px var(--mono); color: #b9b7b0; }
  .tile { position: absolute; border-radius: 4px; overflow: hidden; background: #e9e7e1; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #bhead { position: absolute; left: 12px; top: 12px; right: 12px; font: 600 13px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bhead .meta { font-weight: 400; color: var(--muted); }
  .blabel { position: absolute; left: 12px; font: 600 9px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  #caption {
    position: absolute; left: 348px; top: 460px; width: 432px; height: 18px;
    font: 11px/18px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #footer {
    position: absolute; left: 20px; top: 460px; width: 316px; height: 18px;
    font: 11px/18px var(--sans); color: var(--muted);
  }

  #card {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--bg);
  }
  #card .inner { text-align: center; }
  #card h1 { font: 700 46px/1 var(--sans); letter-spacing: -.02em; }
  #card p { margin-top: 12px; font: 15px/1.4 var(--sans); color: var(--muted); }
  #card code {
    display: inline-block; margin-top: 22px; padding: 10px 18px; border-radius: 8px;
    background: var(--ink); color: #f3f2ee; font: 16px/1 var(--mono);
  }
  #card .small { margin-top: 18px; font-size: 11px; }
</style>
</head>
<body>
  <div id="chat">
    <div class="label">You</div>
    <div id="prompt"></div>
    <div id="calls"></div>
  </div>
  <div id="board"><div class="empty">moodboard</div></div>
  <div id="caption"></div>
  <div id="footer"></div>
  <div id="card"><div class="inner">
    <h1>cosmos-mcp</h1>
    <p>Search and build cosmos.so moodboards from any MCP client</p>
    <code>npx -y cosmos-mcp</code>
    <p class="small" id="cardnote">Unofficial. Replay of real tool output</p>
  </div></div>

<script src="capture.js"></script>
<script>
(() => {
  const C = window.CAPTURE;
  const $ = (id) => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // ---- tool calls ----
  // Each capture lists its calls; `reveal` says what appears on the right when one returns.
  const calls = C.calls.map((c) => ({ ...c, argsHtml: esc(c.args) }));
  const seeds = C.seeds ?? [];

  // ---- timeline (seconds) ----
  const PROMPT = C.prompt;
  const TYPE_START = 0.4, TYPE_CPS = 24;
  const TYPE_END = TYPE_START + PROMPT.length / TYPE_CPS;
  const CALL_RUN = 0.6, CALL_GAP = 0.45;
  let cursor = TYPE_END + 0.35;
  const revealAt = {};
  calls.forEach((c) => {
    c.at = cursor;
    c.res = cursor + CALL_RUN;
    cursor = c.res + CALL_GAP;
    if (c.reveal) revealAt[c.reveal] = c.res;
  });
  const lastRes = calls[calls.length - 1].res;
  const SEED_STEP = 0.12, SEED_FADE = 0.3;
  const TILES_AT = (revealAt.tiles ?? lastRes) + 0.2, TILE_STEP = 0.28, TILE_FADE = 0.35;
  const n = C.tiles.length;
  const TILES_END = TILES_AT + (n - 1) * TILE_STEP + TILE_FADE;
  const DONE_AT = TILES_END + 0.1;
  // How long the finished board stays on screen before the install card.
  const RESULTS_HOLD = 3.5;
  const CARD_AT = DONE_AT + RESULTS_HOLD, CARD_FADE = 0.35, HOLD = 1.6;
  const DURATION = CARD_AT + CARD_FADE + HOLD;
  window.DURATION = DURATION;

  // ---- board panel: optional header and seed strip, then masonry ----
  const board = $("board");
  const BW = 432 - 2, BH = 434 - 2, PAD = 10, GAP = 6;
  let AREA_TOP = 0, AREA_H = BH;
  let headEl = null, seedEls = [], labelEls = [];
  if (C.board) {
    headEl = document.createElement("div");
    headEl.id = "bhead";
    headEl.innerHTML = `${esc(C.board.name)} <span class="meta">· ${C.board.isPrivate ? "private" : "public"} · ${C.board.elementCount} elements</span>`;
    board.appendChild(headEl);
  }
  if (seeds.length) {
    const label = (text, top) => {
      const el = document.createElement("div");
      el.className = "blabel";
      el.style.top = `${top}px`;
      el.textContent = text;
      board.appendChild(el);
      return el;
    };
    labelEls.push(label(C.seedsLabel ?? "Board", 36));
    const SEED = 64;
    seedEls = seeds.map((t, i) => {
      const el = document.createElement("div");
      el.className = "tile";
      Object.assign(el.style, { left: `${12 + i * (SEED + GAP)}px`, top: "50px", width: `${SEED}px`, height: `${SEED}px` });
      el.innerHTML = `<img src="${esc(t.asset)}" alt="">`;
      board.appendChild(el);
      return el;
    });
    labelEls.push(label(C.tilesLabel ?? "Results", 130));
    AREA_TOP = 136;
    AREA_H = BH - AREA_TOP;
  }

  const COLS = seeds.length ? 4 : 3;
  let colW = (BW - 2 * PAD - (COLS - 1) * GAP) / COLS;
  const place = (w) => {
    const heights = new Array(COLS).fill(0);
    return { boxes: C.tiles.map((t) => {
      const c = heights.indexOf(Math.min(...heights));
      const h = (w * t.height) / t.width;
      const box = { col: c, y: heights[c], h };
      heights[c] += h + GAP;
      return box;
    }), maxH: Math.max(...heights) - GAP };
  };
  let lay = place(colW);
  const availH = AREA_H - 2 * PAD;
  if (lay.maxH > availH) { colW *= availH / lay.maxH; lay = place(colW); }
  // Under a seed strip, line the grid up with it on the left; otherwise center it.
  const offX = seeds.length ? 12 : (BW - (COLS * colW + (COLS - 1) * GAP)) / 2;
  const offY = AREA_TOP + (seeds.length ? PAD : (AREA_H - lay.maxH) / 2);

  const tileEls = C.tiles.map((t, i) => {
    const b = lay.boxes[i];
    const el = document.createElement("div");
    el.className = "tile";
    Object.assign(el.style, {
      left: `${offX + b.col * (colW + GAP)}px`, top: `${offY + b.y}px`,
      width: `${colW}px`, height: `${b.h}px`,
    });
    el.innerHTML = `<img src="${esc(t.asset)}" alt="">`;
    board.appendChild(el);
    return el;
  });

  const spinner = (t) => "running" + ".".repeat(1 + (Math.floor(t * 6) % 3));
  $("footer").textContent = C.footer ?? "Replay of real tool output";
  if (C.cardNote) $("cardnote").textContent = C.cardNote;
  const doneText = C.done ?? `Done. ${n} images.`;

  const fadeIn = (el, p) => {
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 10}px) scale(${0.96 + 0.04 * p})`;
  };

  function render(t) {
    // prompt typing
    const chars = Math.floor(clamp((t - TYPE_START) * TYPE_CPS, 0, PROMPT.length));
    const typing = t < TYPE_END + 0.3;
    const blinkOn = typing ? (t < TYPE_START || chars < PROMPT.length || Math.floor(t * 2) % 2 === 0) : false;
    $("prompt").innerHTML = esc(PROMPT.slice(0, chars)) + (blinkOn ? '<span class="cursor"></span>' : "");

    // tool calls
    let html = "";
    for (const c of calls) {
      if (t < c.at) break;
      html += `<div class="call"><div class="name">${esc(c.tool)}</div><div class="args">${c.argsHtml}</div>` +
        (t >= c.res ? `<div class="res">${esc(c.result)}</div>` : `<div class="args spin">${spinner(t)}</div>`) + "</div>";
    }
    if (t >= DONE_AT) {
      const o = ease((t - DONE_AT) / 0.3);
      html += `<div id="done" style="opacity:${o}">${esc(doneText)}</div>`;
    }
    $("calls").innerHTML = html;

    // board header and seed strip
    let shown = false;
    if (headEl) {
      const p = ease((t - (revealAt.header ?? Infinity)) / 0.3);
      headEl.style.opacity = p;
      shown = shown || p > 0;
    }
    const seedsAt = revealAt.seeds ?? Infinity;
    seedEls.forEach((el, i) => fadeIn(el, ease((t - (seedsAt + i * SEED_STEP)) / SEED_FADE)));
    if (labelEls[0]) labelEls[0].style.opacity = ease((t - seedsAt) / 0.3);
    if (labelEls[1]) labelEls[1].style.opacity = ease((t - TILES_AT) / 0.3);

    // tiles
    let latest = -1;
    tileEls.forEach((el, i) => {
      const p = ease((t - (TILES_AT + i * TILE_STEP)) / TILE_FADE);
      fadeIn(el, p);
      if (p > 0) latest = i;
    });
    board.querySelector(".empty").style.opacity = latest >= 0 || shown ? 0 : 1;
    const tile = C.tiles[latest];
    $("caption").textContent = tile ? [tile.id, `@${tile.owner}`, tile.caption].filter(Boolean).join(" · ") : "";

    // title card
    const c = ease((t - CARD_AT) / CARD_FADE);
    $("card").style.opacity = c;
    $("card").style.display = c > 0 ? "grid" : "none";
  }

  window.render = render;
  const q = new URLSearchParams(location.search).get("t");
  render(q === null ? DURATION : Number(q));
})();
</script>
</body>
</html>
