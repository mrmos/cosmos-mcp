name: CI

on:
  push:
    branches: [main]
  pull_request:

# The live-API tests are gated behind COSMOS_LIVE_TESTS and stay off here. CI
# must never need a session cookie.
env:
  COSMOS_LIVE_TESTS: ""

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke-test the built server
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 30 node dist/index.js > handshake.json || true
          cat handshake.json
          grep -q '"serverInfo"' handshake.json
