name: Publish

# Publishes to npm on a version tag, using npm trusted publishing (OIDC).
#
# There is no token to store. npm verifies the workflow's OIDC identity and
# checks it against the trusted publisher configured on the package, which also
# sidesteps the CLI's 2FA problem: a security-key-only account cannot answer the
# one-time-password challenge `npm publish` expects on a laptop.
#
# One-time setup on npmjs.com, under the package's Settings > Trusted Publisher:
#   repository:      mrmos/cosmos-mcp
#   workflow:        publish.yml
#   environment:     (leave blank)
#
# Then release with:
#   npm version patch && git push --follow-tags
#
# The run also publishes server.json to the official MCP registry, which
# authenticates this workflow through the same OIDC token, as io.github.mrmos.
# A tag run also attaches the Claude Desktop extension (.mcpb) to a GitHub
# release. If a release fails after npm, run this workflow by hand on main: it
# skips the npm publish and finishes the registry step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Write is needed to create the GitHub release that carries the .mcpb.
      contents: write
      # Required for npm and the MCP registry to verify this workflow's identity.
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm itself does the publishing; Bun runs the build and tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check the built server answers an MCP handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 30 node dist/index.js > handshake.json || true
          grep -q '"serverInfo"' handshake.json

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      # Skipped when the version is already on npm, so a manual run can finish
      # a release whose later steps failed.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf "https://registry.npmjs.org/cosmos-mcp/$VERSION" > /dev/null; then
            echo "cosmos-mcp@$VERSION is already on npm."
          else
            npm publish --provenance --access public
          fi

      # `npm version` already ran this; running it again makes a manual dispatch safe.
      - name: Sync versions from package.json
        run: bun run scripts/sync-version.ts

      - name: Build the Claude Desktop extension
        run: bun run scripts/build-mcpb.ts

      - name: Attach the extension to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cosmos-mcp-*.mcpb --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" cosmos-mcp-*.mcpb --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # The registry checks that npm serves the version, and npm can take a few
      # minutes to process a new release.
      - name: Wait for npm to serve the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            curl -sf "https://registry.npmjs.org/cosmos-mcp/$VERSION" > /dev/null && exit 0
            sleep 15
          done
          echo "npm did not serve cosmos-mcp@$VERSION within 10 minutes." && exit 1

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
